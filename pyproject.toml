[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keepweft"
version = "0.1.0"
description = "Bounded SQLite backup and validated restore controller"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
keepweft = "keepweft.cli:main"

[tool.setuptools.packages.find]
include = ["keepweft*"]
